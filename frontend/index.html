<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VeloMotion - Pro Client-Side WASM NLE</title>
    <!-- Trunk: compile crate Rust ini menjadi WASM dan sisipkan ke halaman -->
    <link data-trunk rel="rust" data-bin="velomotion-frontend" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            500: '#22c55e',
                            600: '#16a34a',
                            900: '#14532d',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen font-sans selection:bg-green-500 selection:text-white">
    <div id="app"></div>
</body>
</html>
