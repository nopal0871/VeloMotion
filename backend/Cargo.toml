[package]
name = "velomotion-backend-api"
version = "0.1.0"
edition = "2021"

[dependencies]
vercel_runtime = "1.0"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "json", "chrono"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
http = "0.2"
futures = "0.3"
url = "2.5"

[lib]
name = "api_common"
path = "src/lib.rs"

[[bin]]
name = "save_project"
path = "api/save_project.rs"

[[bin]]
name = "load_project"
path = "api/load_project.rs"
